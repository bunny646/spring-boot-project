
name: Hello Apring App to Docker

on:
push:
 
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        run: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test (Maven)
        working-directory: ./hello-spring
        run: mvn -B clean verify

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Test-Reports
          path: ./hello-spring/target/*.jar

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          - name: Setup JDK 17
            uses: actions/setup-java@v5
            with:
              java-version: '17'
              distribution: 'temurin'
          - name: Build JAR for Docker
            working-directory: ./hello-spring
            run: mvn -B clean package -DskipTests
          - name: Login to DockerHub
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

          - name: Build and Push Docker Image
            uses: docker/build-push-action@v5
            with:
              context: ./hello-spring
              push: true
              tags: ${{ secrets.DOCKER_USERNAME }}/hello-spring:latest
              
            
          