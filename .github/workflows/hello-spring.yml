name: Hello Spring App to AWS EKS

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hello-spring.yml
      - Dockerfile
      - pom.xml
      - src/**
      - kubernetes/**

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: hello-spring-boot
          path: target/*.jar

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-spring:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/hello-spring:latest

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name mycluster --region ap-south-1 

      - name: Verify connection
        run: kubectl get nodes 

      - name: Deploy to EKS
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl set image deployment/hello-spring hello-spring="${DOCKER_USERNAME}/hello-spring:${GITHUB_SHA}"
          kubectl rollout status deployment/hello-spring
          